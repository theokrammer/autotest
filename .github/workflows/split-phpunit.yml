name: Split PHPUnit Subdirectory to Read-Only Mirror

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  split-phpunit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split adapters/hydrators/phpunit-autotest
        uses: automattic/action-splitsh@v1.0.0
        with:
          prefix: adapters/hydrators/phpunit-autotest
          remote: https://github.com/autotest/phpunit.git
          branch: main
          tags: true
