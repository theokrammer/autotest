[workspace]
resolver = "2"
members = [
    "crates/autotest-core",
    "crates/autotest-proto",
    "crates/autotest-sandbox",
    "crates/autotest-cli",
    "crates/autotest-php-extractor",
    "crates/autotest-ts-precheck",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive", "cargo"] }
schemars = { version = "0.8", features = ["preserve_order"] }
regex = "1.11"
tempfile = "3.13"
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
walkdir = "2.5"
